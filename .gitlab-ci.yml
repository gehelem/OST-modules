stages:
  - build
  - upload
  - release

variables:
  DEB_FILE: "ostmodules_${CI_COMMIT_TAG}_amd64.deb"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/latest/${CI_COMMIT_TAG}"


build-job:
  stage: build
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get clean
    - apt-get install -y software-properties-common curl jq unzip wget
    - apt-add-repository ppa:mutlaqja/ppa
    - apt-get update
    - apt-get clean
    - apt-get install -y autotools-dev build-essential cmake debhelper devscripts dpkg-dev extra-cmake-modules git intltool-debian libavahi-client-dev libavahi-common-dev libcfitsio-dev libeigen3-dev libgsl-dev libindi-dev libkf5config-dev libkf5crash-dev libkf5doctools-dev libkf5guiaddons-dev libkf5i18n-dev libkf5newstuff-dev libkf5notifications-dev libkf5notifyconfig-dev libkf5plotting-dev libkf5xmlgui-dev libnova-dev libopencv-dev libqt5scxml5-dev libqt5svg5-dev libqt5websockets5-dev libraw-dev libsecret-1-dev libstellarsolver-dev lintian npm qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev wcslib-dev zlib1g-dev
#    - echo "Downloading ostserver from OST project artifacts..."
#    - export LAST_JOB=$(curl -s "https://gitlab.ostserver.fr/api/v4/projects/1/pipelines" | jq -r '.[] | select(.status=="success") | .id' | head -1)
#    - echo "Last success pipeline:" $LAST_JOB
#    - export PACKAGE_JOB=$(curl -s "https://gitlab.ostserver.fr/api/v4/projects/1/pipelines/${LAST_JOB}/jobs" | jq -r '.[] | select(.name=="package-deb" and .status=="success") | .id' | head -1)
#    - echo "Package job ID:" $PACKAGE_JOB
#    - wget --user-agent="Mozilla/5.0" "https://gitlab.ostserver.fr/gilles/OST/-/jobs/${PACKAGE_JOB}/artifacts/download?file_type=archive" -O artifacts.zip
#    - unzip -l artifacts.zip
#    - unzip artifacts.zip -d /tmp/
    - wget https://gitlab.ostserver.fr/api/v4/projects/1/packages/generic/latest/0.0.0/ostserver_0.0.0_amd64.deb
    - apt install -y ./ostserver_0.0.0_amd64.deb
#    - mkdir build install
#    - cd build
#    - cmake ..
#    - make -j4
#    - cmake --install . --prefix=../install
#    - cd ..
#    - echo "Contents of install directory:"
#    - ls -la install/
#    - find install/ -type f | head -20
    - dpkg-buildpackage -us -uc 
    - mv ../ostmodules_0.0.0_amd64.deb  ./${DEB_FILE}
    - dpkg -i ${DEB_FILE}
    - echo "Quick test..."
    - mkdir media
    - export QT_QPA_PLATFORM=offscreen
    - ostserver --webroot=media > server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 7
    - ps aux | grep ostserver | grep -v grep
    - node test-ws.js 2>&1 | tee ws.log
    - echo "Server logs:"
    - tail -50 server.log
    - kill $SERVER_PID || true
  artifacts:
    paths:
      - ${DEB_FILE}
      - server.log
      - ws.log
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

upload-job:
  stage: upload
  dependencies:
    - build-job
  image: curlimages/curl:latest
  script:
    - |
      curl --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${DEB_FILE} ${PACKAGE_REGISTRY_URL}/${DEB_FILE}
  rules:
      - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

release-job:
  stage: release
  dependencies:
    - upload-job
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --assets-link "{\"name\":\"${DEB_FILE}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${DEB_FILE}\"}" 
  rules:
      - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

